# Reclazz Integration Test Extension
# This extension provides REST endpoints for testing hot-reload features.

reclazztest.webmodule=true

# Without this the platform loads no core Spring config for the extension,
# so the interceptor mapping below never reaches the registry.
reclazztest.application-context=reclazztest-spring.xml

# Two OCC handlers share /{baseSiteId}/reclazzwinner; the higher priority answers.
reclazztest.occ.winnerA.priority=10
reclazztest.occ.winnerB.priority=20

# Mutable default-profile test key and an unrelated control, both restored by value.
reclazztest.batch.value=config-v1
reclazztest.batch.stable=stable-v1

# Owned native logging coverage; restore levels explicitly, never delete them.
log4j2.logger.reclazzProbeTarget.name=com.onurkat.reclazztest.logprobe.target
log4j2.logger.reclazzProbeTarget.level=INFO
log4j2.logger.reclazzProbeControl.name=com.onurkat.reclazztest.logprobe.control
log4j2.logger.reclazzProbeControl.level=INFO

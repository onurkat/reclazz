<!--
  Tool-window icon, light IDE themes. Same mark as the plugin icon without the
  tile, in the darker end of the brand ramp so it holds up on a light toolbar.
  Master: branding/reclazz-mark.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="11 11 42 42">
  <defs>
    <linearGradient id="reclazzIcon" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#reclazzIcon)" stroke-width="5" stroke-linecap="round">
    <path d="M43.49 41.64A15 15 0 0 1 17.23 34.60"/>
    <path d="M20.51 22.36A15 15 0 0 1 46.77 29.40"/>
  </g>
  <path d="M15.84 26.72L12.57 36.95L22.41 35.21Z" fill="url(#reclazzIcon)"/>
  <path d="M48.16 37.28L51.43 27.05L41.59 28.79Z" fill="url(#reclazzIcon)"/>
</svg>

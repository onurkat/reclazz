// Release uploads must consume the files already checked by release.sh.
// This init script is used only for the upload invocation, never for builds.
def uploads = [':publishPlugin', ':gradle-plugin:publishPlugins'] as Set
// Gradle publishes an artifact only if the task that writes it is enabled, so
// these stay on; they find their outputs up to date, and the checked digests
// below refuse any byte they would change.
def portalArtifactTasks = ['jar', 'javadocJar', 'sourcesJar', 'generatePomFileForPluginMavenPublication',
        'generateMetadataFileForPluginMavenPublication'].collect { ':gradle-plugin:' + it } as Set
gradle.taskGraph.whenReady { graph ->
    if (!graph.allTasks.any { uploads.contains(it.path) }) {
        throw new GradleException('Release upload invocation contains no supported publisher')
    }
    graph.allTasks.each { task ->
        if (task.path == ':publishPlugin') {
            // The platform uploads signPlugin's output only when signPlugin did
            // work in this invocation; it is disabled below, so without this the
            // unsigned zip would be the one uploaded.
            task.archiveFile.set(task.project.tasks.getByName('signPlugin').signedArchiveFile)
        }
        if (uploads.contains(task.path)) {
            task.doFirst {
                def publisher = task.path == ':publishPlugin' ? 'marketplace' : 'portal'
                def files
                if (publisher == 'marketplace') {
                    files = [task.archiveFile.get().asFile.absolutePath]
                } else {
                    def publication = task.project.publishing.publications.getByName('pluginMaven')
                    files = publication.artifacts.collect { it.file.absolutePath }
                    files += task.project.tasks.getByName('generatePomFileForPluginMavenPublication').destination.absolutePath
                    files += task.project.tasks.getByName('generateMetadataFileForPluginMavenPublication').outputFile.get().asFile.absolutePath
                }
                task.project.exec {
                    workingDir gradle.rootProject.projectDir
                    commandLine(['python3', 'scripts/release-evidence.py', 'verify-publisher', publisher] + files)
                }
            }
        } else if (!portalArtifactTasks.contains(task.path)) {
            // Keep the configured publication and its artifact paths, but do
            // not run compilers or signing again.
            task.enabled = false
        }
    }
}

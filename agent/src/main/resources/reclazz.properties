# Reclazz Default Configuration
#
# These defaults can be overridden via agent arguments:
#   -javaagent:reclazz-agent.jar=key1=value1,key2=value2

# Debounce delay in milliseconds (prevents duplicate reloads for rapid saves)
debounceMs=500

# Auto-compile on file change (optional, requires JDK not JRE)
# When false (default): watches compiled .class files from 'ant build' output
# When true: watches .java source files and compiles them internally (no ant needed)
autoCompile=false

# Auto-import changed ImpEx files (opt-in, can modify data)
autoImpex=false

# Verbose logging
verbose=false

# Watch all extensions or specify a list
# watchExtensions=myext1;myext2

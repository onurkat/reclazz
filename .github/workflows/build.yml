name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows is in here because the code is full of path handling and none of
    # it had ever been exercised on a platform with a different separator. The
    # verifier only runs once, on Linux: it downloads whole IDEs and the answer
    # does not depend on the host.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean build

      - name: Build Plugin
        run: ./gradlew buildPlugin

      # Marketplace runs this on submission; failing here instead means we
      # never find out from a rejection email.
      - name: Verify Plugin (JetBrains Plugin Verifier)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew verifyPlugin

      - name: Upload Plugin Artifact
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: reclazz-plugin
          path: build/distributions/*.zip

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            agent/build/reports/tests/
            build/reports/tests/
            build/reports/pluginVerifier/
          if-no-files-found: ignore

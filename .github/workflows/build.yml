name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean build

      - name: Build Plugin
        run: ./gradlew buildPlugin

      # Marketplace runs this on submission; failing here instead means we
      # never find out from a rejection email.
      - name: Verify Plugin (JetBrains Plugin Verifier)
        run: ./gradlew verifyPlugin

      - name: Upload Plugin Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: reclazz-plugin
          path: build/distributions/*.zip

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            agent/build/reports/tests/
            build/reports/
          if-no-files-found: ignore

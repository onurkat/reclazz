name: Build

on:
  push:
    branches: [main]
    # A change to prose builds nothing. Release notes, the changelog and the
    # docs are the most frequent commits here, and each one ran the whole
    # matrix, Windows included, to test code it did not touch.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'branding/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'branding/**'
      - 'LICENSE'
      - 'NOTICE'

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A sign-off that is only asked for in a document is a sign-off that stops
  # happening. This is what keeps the project's copyright provenance intact,
  # which is what makes relicensing or dual licensing possible later.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by
        run: |
          missing=0
          for commit in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$commit" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::$commit has no Signed-off-by line: $(git log -1 --format=%s "$commit")"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Sign your commits with 'git commit -s', or fix an existing branch with 'git rebase --signoff'."
            echo "See CONTRIBUTING.md#sign-your-work."
            exit 1
          fi
          echo "All commits are signed off."

  build:
    # Windows is in here because the code is full of path handling and none of
    # it had ever been exercised on a platform with a different separator. The
    # verifier only runs once, on Linux: it downloads whole IDEs and the answer
    # does not depend on the host.
    # Two JDKs on Linux, because the agent runs on 17 through 25 and the two
    # javacs compile the same source differently: an enum switch test passed
    # for weeks on the maintainer's 21 while every CI run on 17 failed. Windows
    # stays on one JDK; it is here for the path handling, which does not
    # depend on the compiler.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        jdk: ['17', '21']
        exclude:
          - os: windows-latest
            jdk: '21'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # One Gradle invocation for both: the second one paid the whole
      # configuration again, on every job, for a task the first could have
      # run. The runner is fresh, so there is nothing for clean to clean.
      - name: Pull pinned RabbitMQ broker for integration tests
        if: matrix.os == 'ubuntu-latest'
        run: docker pull rabbitmq@sha256:3486d98205df3d6395ed70e7924baa13b561cbac54116c0ddae5b0b7382bbabd

      - name: Build and test, then package the plugin
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew build buildPlugin

      - name: Build and test on Windows (Linux RabbitMQ broker suite explicitly omitted)
        if: matrix.os == 'windows-latest'
        run: ./gradlew build buildPlugin -Preclazz.skipRabbitBroker=true

      # Marketplace runs this on submission; failing here instead means we
      # never find out from a rejection email.
      - name: Verify Plugin (JetBrains Plugin Verifier)
        if: matrix.os == 'ubuntu-latest' && matrix.jdk == '17'
        run: ./gradlew verifyPlugin

      - name: Upload Plugin Artifact
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.jdk == '17'
        uses: actions/upload-artifact@v4
        with:
          name: reclazz-plugin
          path: build/distributions/*.zip

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: |
            agent/build/reports/tests/
            build/reports/tests/
            build/reports/pluginVerifier/
          if-no-files-found: ignore

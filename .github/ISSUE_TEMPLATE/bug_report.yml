name: Bug Report
description: Report a bug in Reclazz
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open project with...
        2. Enable Reclazz in settings
        3. Edit a Java file and run ant build
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: input
    id: intellij-version
    attributes:
      label: IntelliJ IDEA Version
      placeholder: "2024.3.1"
    validations:
      required: true
  - type: input
    id: jdk-version
    attributes:
      label: JDK Version
      placeholder: "JBR 21.0.5 / OpenJDK 17.0.12 / DCEVM 21"
    validations:
      required: true
  - type: input
    id: commerce-version
    attributes:
      label: SAP Commerce Version
      placeholder: "2211.28"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 15.2 / Ubuntu 24.04 / Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste logs from the Reclazz tool window
      render: text
